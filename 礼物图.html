<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>礼物图素材库 · Gift Gallery</title>

    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.23.0/dist/index.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>

    <style>
        :root {
            --brand: #00AEEC;
            --brand-hover: #0095CC;
            --brand-light: #E6F7FF;
            --brand-border: #91D5FF;
            --accent: #FB7299;
            --accent-hover: #E85C85;
            --accent-light: #FFF0F5;
            --accent-border: #FFC0D4;
            --bg: #F6F7F8;
            --bg-card: #FFFFFF;
            --bg-hover: #F0F1F2;
            --text-primary: #18191C;
            --text-secondary: #61666D;
            --text-tertiary: #9499A0;
            --text-inverse: #FFFFFF;
            --border: #E3E5E7;
            --border-light: #F1F2F3;
            --shadow-xs: 0 1px 2px rgba(24, 25, 28, 0.04);
            --shadow-sm: 0 1px 3px rgba(24, 25, 28, 0.06), 0 1px 2px rgba(24, 25, 28, 0.04);
            --shadow-md: 0 4px 12px rgba(24, 25, 28, 0.08), 0 2px 4px rgba(24, 25, 28, 0.04);
            --shadow-lg: 0 12px 32px rgba(24, 25, 28, 0.10), 0 4px 8px rgba(24, 25, 28, 0.04);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --header-h: 64px;
            --sidebar-w: 220px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .nav-inner {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            text-decoration: none;
            color: var(--text-primary);
        }
        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .brand-logo svg {
            width: 18px;
            height: 18px;
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .brand-name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .brand-sub {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 500;
            margin-top: 2px;
        }

        .nav-search {
            flex: 1;
            max-width: 480px;
            position: relative;
        }
        .nav-search input {
            width: 100%;
            height: 38px;
            padding: 0 14px 0 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 13.5px;
            background: var(--bg);
            color: var(--text-primary);
            outline: none;
            transition: all 0.18s ease;
        }
        .nav-search input::placeholder {
            color: var(--text-tertiary);
        }
        .nav-search input:focus {
            border-color: var(--brand);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 174, 236, 0.12);
        }
        .nav-search .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            display: flex;
            pointer-events: none;
        }
        .nav-search .search-icon svg {
            width: 16px;
            height: 16px;
        }
        .nav-search .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-tertiary);
            color: #fff;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            line-height: 1;
            padding: 0;
            transition: background 0.15s;
        }
        .nav-search .clear-btn:hover {
            background: var(--text-secondary);
        }
        .nav-search .clear-btn.visible {
            display: flex;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--brand-light);
            color: var(--brand);
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid var(--brand-border);
        }
        .stat-pill .num {
            font-weight: 700;
        }

        .report-widget {
            position: relative;
            display: inline-block;
        }
        .report-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid var(--accent-border);
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }
        .report-btn:hover {
            background: var(--accent);
            color: #fff;
        }
        .report-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 6px;
            z-index: 200;
            min-width: 220px;
        }
        .report-widget:hover .report-dropdown {
            display: block;
        }
        .report-item {
            display: block;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: background 0.15s;
        }
        .report-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .report-item+.report-item {
            margin-top: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 16px;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.18s ease;
            white-space: nowrap;
            user-select: none;
            text-decoration: none;
        }
        .btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: var(--shadow-xs);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--brand-hover);
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #fff;
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: #CBD5E1;
        }
        .btn-secondary:active:not(:disabled) {
            transform: translateY(1px);
        }
        .btn .badge-num {
            background: rgba(255, 255, 255, 0.25);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        .btn-secondary .badge-num {
            background: var(--brand-light);
            color: var(--brand);
        }
        .btn .spinner {
            display: none;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn.loading .spinner {
            display: inline-block;
        }
        .btn.loading .btn-icon,
        .btn.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .layout {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding-top: var(--header-h);
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            position: sticky;
            top: var(--header-h);
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px 12px 16px;
            border-right: 1px solid var(--border-light);
            background: var(--bg);
        }
        .sidebar-section {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            padding: 0 10px 8px;
        }
        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .filter-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .filter-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .filter-item.active {
            background: var(--brand-light);
            color: var(--brand);
            font-weight: 600;
        }
        .filter-item .letter {
            font-weight: 600;
            font-size: 12.5px;
            width: 20px;
            text-align: center;
        }
        .filter-item .count {
            font-size: 11.5px;
            color: var(--text-tertiary);
            font-weight: 500;
            background: rgba(148, 163, 184, 0.12);
            padding: 1px 7px;
            border-radius: 10px;
        }
        .filter-item.active .count {
            background: rgba(0, 174, 236, 0.12);
            color: var(--brand);
        }
        .filter-item.current {
            padding-left: 26px;
            color: var(--text-primary);
            font-weight: 600;
        }
        .filter-item.current::before {
            content: '→';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            line-height: 1;
        }
        .filter-item.current.active {
            padding-left: 26px;
        }
        .sidebar-footer {
            flex-shrink: 0;
            padding: 14px 10px 0;
            border-top: 1px solid var(--border-light);
            margin-top: 4px;
        }
        .sidebar-footer-text {
            font-size: 11.5px;
            color: var(--text-tertiary);
            line-height: 1.6;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 20px 24px 40px;
        }
        .toolbar {
            position: sticky;
            top: var(--header-h);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 -24px 18px;
            padding: 12px 24px;
            flex-wrap: wrap;
            background: rgba(246, 247, 248, 0.92);
            backdrop-filter: saturate(180%) blur(10px);
            -webkit-backdrop-filter: saturate(180%) blur(10px);
            border-bottom: 1px solid var(--border-light);
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .select-all {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
        }
        .select-all:hover {
            background: var(--bg-hover);
        }
        .select-all input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--brand);
            cursor: pointer;
        }
        .selected-info {
            font-size: 12.5px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        .selected-info strong {
            color: var(--accent);
            font-weight: 700;
        }

        .section-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 4px 10px;
            margin-top: 4px;
        }
        .section-header:first-of-type {
            margin-top: 0;
        }
        .section-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            background: var(--brand);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .section-count {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 14px;
            cursor: grab;
            user-select: none;
        }
        .grid:active {
            cursor: grabbing;
        }

        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            content-visibility: auto;
            contain-intrinsic-size: 200px;
        }
        .card:hover {
            border-color: #CBD5E1;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .card.selected {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(0, 174, 236, 0.15), var(--shadow-sm);
        }
        .card.selected .card-check {
            background: var(--brand);
            border-color: var(--brand);
        }
        .card.selected .card-check svg {
            opacity: 1;
            transform: scale(1);
        }

        .card-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            background: #FAFBFC;
            overflow: hidden;
            flex-shrink: 0;
        }
        .card-img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 14px;
            transition: transform 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
            z-index: 1;
            draggable: false;
        }
        .card:hover .card-img-wrap img {
            transform: scale(1.04);
        }
        .card-img-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #F0F1F2 25%, #E3E5E7 50%, #F0F1F2 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            z-index: 0;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .card-check {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #CBD5E1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            box-shadow: var(--shadow-xs);
            cursor: pointer;
        }
        .card-check svg {
            width: 12px;
            height: 12px;
            color: #fff;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }
        .card-check:hover {
            border-color: var(--brand);
            transform: scale(1.08);
        }

        .card-name {
            padding: 8px 10px;
            text-align: center;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            min-height: 20px;
            transition: color 0.15s;
        }
        .card:hover .card-name {
            color: var(--text-primary);
        }

        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 72px 20px;
            text-align: center;
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }
        .empty-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
        }
        .empty-icon svg {
            width: 22px;
            height: 22px;
        }
        .empty-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .empty-desc {
            font-size: 12.5px;
            color: var(--text-tertiary);
            max-width: 320px;
        }
        .empty-desc code {
            background: var(--bg-hover);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .footer {
            border-top: 1px solid var(--border);
            background: #fff;
            padding: 20px 24px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-tertiary);
        }
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        .footer a:hover {
            color: var(--brand);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 80vw;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .scroll-buttons {
            position: fixed;
            bottom: 28px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 90;
        }
        .scroll-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            box-shadow: var(--shadow-sm);
            user-select: none;
            padding: 0;
        }
        .scroll-btn svg {
            width: 18px;
            height: 18px;
        }
        .scroll-btn:hover {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .scroll-btn:active {
            transform: translateY(0) scale(0.94);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9499A0;
        }
        ::selection {
            background: rgba(0, 174, 236, 0.15);
            color: var(--text-primary);
        }

        @media (max-width: 1024px) {
            :root {
                --sidebar-w: 180px;
            }
            .nav-inner {
                padding: 0 16px;
            }
            .main {
                padding: 16px;
            }
            .toolbar {
                margin: 0 -16px 18px;
                padding: 12px 16px;
            }
        }

        .mobile-letter-nav {
            display: none;
            width: 100%;
            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
            padding-top: 8px;
            border-top: 1px solid var(--border-light);
        }
        .mobile-letter-nav .nav-item {
            display: inline-flex;
            align-items: center;

            min-width: 32px;

        @media (max-width: 768px) {

                display: none;

                top: 6px;
                left: 6px;

        @media (max-width: 480px) {

    </style>
</head>

                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>

    <footer class="footer">
        与歌一生的 Bilibili 礼物图分享 · Gift Gallery
    </footer>

    <div class="scroll-buttons">
        <button class="scroll-btn" id="scrollTopBtn" title="回到顶部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </button>
        <button class="scroll-btn" id="scrollBottomBtn" title="前往底部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/gh/SGMax1/bili_img@main/gallery-data.js"></script>

    <script>
        // ============================================================
        // 1. Toast
        // ============================================================
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(message, type = 'info') {
            const icons = {
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
                warn: '<svg viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
            };
            toastEl.innerHTML = (icons[type] || icons.info) + '<span>' + message + '</span>';
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
        }

        function copyText(text, successMsg) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast(successMsg, 'success')).catch(() => fallbackCopy(
                text, successMsg));
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg, 'success');
            } catch (e) {
                showToast('复制失败，请手动复制：' + text, 'error');
            }
            document.body.removeChild(textarea);
        }

        document.getElementById('copyQQ').addEventListener('click', function() {
            copyText('1794928905', 'QQ号已复制');
        });

        // ============================================================
        // 2. 数据校验
        // ============================================================
        if (typeof galleryData === 'undefined' || !galleryData.length) {
            document.getElementById('gridContainer').innerHTML =
                '<div class="empty-state">' +
                '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>' +
                '<div class="empty-title">数据加载失败</div>' +
                '<div class="empty-desc">请确保 <code>gallery-data.js</code> 文件存在且数据格式正确</div>' +
                '</div>';
            throw new Error('galleryData 未定义或为空');
        }

        const pinyinFn = window.pinyin || (window.pinyinPro && window.pinyinPro.pinyin);
        if (!pinyinFn) console.warn('pinyin-pro 库未加载，将直接取首字符作为分组标识。');

        function sortByName(data) {
            return [...data].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh'));
        }

        function enrichWithFirstLetter(data) {
            return data.map(item => {
                let first = '#';
                if (item.name) {
                    try {
                        let raw = null;
                        if (pinyinFn) {
                            const py = pinyinFn(item.name, { pattern: 'first' });
                            if (py && py.length > 0) raw = py[0];
                        }
                        if (raw) {
                            raw = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                            first = raw.toUpperCase();
                            if (!/^[A-Z0-9]$/.test(first)) first = '#';
                        } else {
                            const ch = item.name.charAt(0);
                            if (/^[A-Z0-9]$/i.test(ch)) first = ch.toUpperCase();
                            else first = '#';
                        }
                    } catch (e) {
                        const ch = item.name.charAt(0);
                        if (/^[A-Z0-9]$/i.test(ch)) first = ch.toUpperCase();
                        else first = '#';
                    }
                }
                return Object.assign({}, item, { firstLetter: first });
            });
        }

        // ============================================================
        // 3. DOM 引用 & 状态
        // ============================================================
        const grid = document.getElementById('gridContainer');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const totalSpan = document.getElementById('totalCount');
        const selectedCountNum = document.getElementById('selectedCountNum');
        const downloadBadge = document.getElementById('downloadBadge');
        const selectAllCheck = document.getElementById('selectAllCheck');
        const invertSelectBtn = document.getElementById('invertSelectBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const filterList = document.getElementById('filterList');
        const mobileLetterNav = document.getElementById('mobileLetterNav');

        const sortedRaw = sortByName(galleryData);
        const enrichedData = enrichWithFirstLetter(sortedRaw);
        let currentData = enrichedData.slice();
        let selectedSet = new Set();
        let activeFilter = 'all';
        let currentLetter = '';
        let isHoveringGrid = false;
        let isMouseDown = false;
        let isDraggingActive = false;
        let dragStartX = 0,
            dragStartY = 0;
        let dragStartScrollTop = 0,
            dragStartScrollLeft = 0;
        let dragMoved = false;
        let suppressClick = false;

        function getKey(item) { return item.src + '|' + item.name; }

        function sortLetters(letters) {
            return letters.slice().sort((a, b) => {
                if (a === '#') return 1;
                if (b === '#') return -1;
                if (a >= '0' && a <= '9' && b >= 'A' && b <= 'Z') return -1;
                if (b >= '0' && b <= '9' && a >= 'A' && a <= 'Z') return 1;
                return a.localeCompare(b);
            });
        }

        // ============================================================
        // 4. 侧边栏筛选
        // ============================================================
        function buildFilter(groups) {
            const allLetters = sortLetters(Object.keys(groups));
            let html = '';
            const totalCount = enrichedData.length;
            html += '<div class="filter-item' + (activeFilter === 'all' ? ' active' : '') + '" data-letter="all">' +
                '<span style="display:flex;align-items:center;gap:8px;">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>' +
                '全部素材' +
                '</span>' +
                '<span class="count">' + totalCount + '</span>' +
                '</div>';

            for (const l of allLetters) {
                const count = groups[l] ? groups[l].length : 0;
                html += '<div class="filter-item' + (activeFilter === l ? ' active' : '') + '" data-letter="' + l + '">' +
                    '<span class="letter">' + l + '</span>' +
                    '<span class="count">' + count + '</span>' +
                    '</div>';
            }

            filterList.innerHTML = html;

            filterList.querySelectorAll('.filter-item').forEach(el => {
                el.addEventListener('click', function() {
                    const letter = this.dataset.letter;
                    if (letter === activeFilter) {
                        activeFilter = 'all';
                    } else {
                        activeFilter = letter;
                    }
                    if (activeFilter !== 'all') {
                        currentLetter = '';
                        updateScrollSpy();
                    }
                    applyFilterAndSearch();
                    if (activeFilter !== 'all') {
                        const header = document.querySelector('.section-header[data-letter="' + activeFilter + '"]');
                        if (header) {
                            setTimeout(() => header.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
                        }
                    } else {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(() => {
                            const headers = document.querySelectorAll('.section-header');
                            for (const h of headers) {
                                if (h.getBoundingClientRect().top <= 120) {
                                    currentLetter = h.dataset.letter;
                                }
                            }
                            updateScrollSpy();
                        }, 300);
                    }
                });
            });
        }

        function updateFilterActive() {
            filterList.querySelectorAll('.filter-item').forEach(el => {
                el.classList.toggle('active', el.dataset.letter === activeFilter);
            });
        }

        function updateScrollSpy() {
            filterList.querySelectorAll('.filter-item').forEach(el => {
                el.classList.toggle('current', el.dataset.letter === currentLetter);
            });
            if (currentLetter) {
                const item = filterList.querySelector('.filter-item[data-letter="' + currentLetter + '"]');
                if (item) {
                    const section = document.querySelector('.sidebar-section');
                    const itemTop = item.offsetTop;
                    const itemBottom = itemTop + item.offsetHeight;
                    const viewTop = section.scrollTop;
                    const viewBottom = viewTop + section.clientHeight;
                    const margin = 40;
                    if (itemTop < viewTop + margin) {
                        section.scrollTop = Math.max(0, itemTop - margin);
                    } else if (itemBottom > viewBottom - margin) {
                        section.scrollTop = itemBottom - section.clientHeight + margin;
                    }
                }
            }
        }

        function updateScrollSpyFromScroll() {
            if (activeFilter !== 'all' || isHoveringGrid || (isMouseDown && isDraggingActive)) return;
            const headers = document.querySelectorAll('.section-header');
            let current = '';
            for (const h of headers) {
                const rect = h.getBoundingClientRect();
                if (rect.top <= 120) current = h.dataset.letter;
            }
            if (current !== currentLetter) {
                currentLetter = current;
                updateScrollSpy();
            }
        }

        function getLetterFromMouseY(clientY) {
            const headers = document.querySelectorAll('.section-header');
            if (!headers.length) return null;
            let current = null;
            for (let i = 0; i < headers.length; i++) {
                const rect = headers[i].getBoundingClientRect();
                if (clientY >= rect.top) {
                    current = headers[i].dataset.letter;
                } else {
                    break;
                }
            }
            return current;
        }

        function updateSelectionUI() {
            const count = selectedSet.size;
            selectedCountNum.textContent = count;
            downloadBadge.textContent = count;
            const total = currentData.length;
            if (total > 0 && count === total) {
                selectAllCheck.checked = true;
                selectAllCheck.indeterminate = false;
            } else if (count > 0 && count < total) {
                selectAllCheck.checked = false;
                selectAllCheck.indeterminate = true;
            } else {
                selectAllCheck.checked = false;
                selectAllCheck.indeterminate = false;
            }
            downloadBtn.disabled = count === 0;
            document.querySelectorAll('.card').forEach(card => {
                const key = card.dataset.key;
                card.classList.toggle('selected', key && selectedSet.has(key));
            });
        }

        // ============================================================
        // 5. 渲染
        // ============================================================
        function render(list) {
            if (!list || list.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>' +
                    '<div class="empty-title">没有找到匹配的礼物</div>' +
                    '<div class="empty-desc">尝试更换搜索关键词，或选择其他字母分类</div>' +
                    '</div>';
                selectedSet.clear();
                updateSelectionUI();
                updateMobileNav([]);
                return;
            }

            const groups = {};
            for (const item of list) {
                const letter = item.firstLetter || '#';
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(item);
            }
            const sortedLetters = sortLetters(Object.keys(groups));

            let html = '';
            for (const letter of sortedLetters) {
                const items = groups[letter];
                html += '<div class="section-header" data-letter="' + letter + '">' +
                    '<span class="section-letter">' + letter + '</span>' +
                    '<span class="section-title">' + letter + ' 开头</span>' +
                    '<span class="section-count">' + items.length + ' 件</span>' +
                    '<span class="section-line"></span>' +
                    '</div>';

                for (const item of items) {
                    const key = getKey(item);
                    const safeName = item.name || '未命名';
                    const checked = selectedSet.has(key) ? 'selected' : '';
                    html +=
                        '<div class="card ' + checked + '" data-key="' + key + '" data-letter="' + letter + '">' +
                        '<div class="card-img-wrap">' +
                        '<img src="' + item.src + '" alt="' + safeName + '" loading="lazy" draggable="false" ' +
                        'onload="this.classList.add(\'loaded\')" ' +
                        'onerror="this.style.opacity=\'0.3\'; this.alt=\'加载失败，请刷新重试\'" />' +
                        '</div>' +
                        '<div class="card-name" title="' + safeName + '">' + safeName + '</div>' +
                        '<div class="card-check" data-key="' + key + '">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
                        '</div>' +
                        '</div>';
                }
            }

            grid.innerHTML = html;

            document.querySelectorAll('.card').forEach(card => {
                const key = card.dataset.key;
                card.addEventListener('click', function(e) {
                    if (suppressClick) {
                        suppressClick = false;
                        return;
                    }
                    if (e.target.closest('.card-check')) return;
                    toggleSelect(key);
                });
                const checkEl = card.querySelector('.card-check');
                if (checkEl) {
                    checkEl.addEventListener('click', function(e) {
                        if (suppressClick) {
                            suppressClick = false;
                            return;
                        }
                        e.stopPropagation();
                        toggleSelect(key);
                    });
                }
            });

            updateSelectionUI();
            updateMobileNav(sortedLetters);
        }

        function updateMobileNav(letters) {
            if (!mobileLetterNav) return;
            let html = '';
            letters.forEach(letter => {
                const isActive = activeFilter === letter;
                html += '<div class="nav-item' + (isActive ? ' active' : '') + '" data-letter="' + letter + '">' +
                    letter + '</div>';
            });
            mobileLetterNav.innerHTML = html;

            mobileLetterNav.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    const letter = this.dataset.letter;
                    if (letter === activeFilter) {
                        activeFilter = 'all';
                    } else {
                        activeFilter = letter;
                    }
                    applyFilterAndSearch();
                    if (activeFilter !== 'all') {
                        const header = document.querySelector('.section-header[data-letter="' + activeFilter + '"]');
                        if (header) {
                            setTimeout(() => header.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
                        }
                    } else {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });
        }

        function applyFilterAndSearch() {
            const q = (searchInput.value || '').trim().toLowerCase();
            let filtered = enrichedData;

            if (activeFilter !== 'all') {
                filtered = filtered.filter(item => (item.firstLetter || '#') === activeFilter);
            }

            if (q) {
                filtered = filtered.filter(item => (item.name || '').toLowerCase().includes(q));
            }

            currentData = filtered;

            const visibleKeys = new Set(currentData.map(item => getKey(item)));
            for (const k of selectedSet) {
                if (!visibleKeys.has(k)) selectedSet.delete(k);
            }

            updateFilterActive();
            render(currentData);
        }

        function updateClearBtn() {
            clearSearchBtn.classList.toggle('visible', searchInput.value.length > 0);
        }

        function toggleSelect(key) {
            if (selectedSet.has(key)) selectedSet.delete(key);
            else selectedSet.add(key);
            updateSelectionUI();
        }

        function toggleSelectAll(checked) {
            if (checked) currentData.forEach(item => selectedSet.add(getKey(item)));
            else currentData.forEach(item => selectedSet.delete(getKey(item)));
            updateSelectionUI();
        }

        function invertSelection() {
            currentData.forEach(item => {
                const key = getKey(item);
                if (selectedSet.has(key)) selectedSet.delete(key);
                else selectedSet.add(key);
            });
            updateSelectionUI();
        }

        function generateZipName() {
            const date = new Date();
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const random = String(Math.floor(100 + Math.random() * 900));
            return `礼物图_${y}${m}${d}_${random}.zip`;
        }

        // ============================================================
        // 6. ★★★ 核心修复：fetchImageAsBlob 支持 CORS 代理 ★★★
        // ============================================================
        async function fetchImageAsBlob(url, retries = 2) {
            // ---- 第一步：直接 fetch（CORS 模式） ----
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, { mode: 'cors' });
                    if (res.ok) {
                        const blob = await res.blob();
                        return blob;
                    }
                } catch (e) {
                    console.warn(`[CORS] 直接 fetch 失败 (${i + 1}/${retries}):`, e.message);
                }
                if (i < retries - 1) {
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            // ---- 第二步：使用 CORS 代理服务 ----
            // 按优先级从高到低排列
            const proxyList = [
                // 1. allorigins.win（推荐，稳定，支持 raw 模式）
                (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                // 2. corsproxy.io（备选）
                (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
                // 3. cors-anywhere（备选，可能有访问限制）
                (u) => `https://cors-anywhere.herokuapp.com/${u}`,
            ];

            for (const proxy of proxyList) {
                try {
                    const proxyUrl = proxy(url);
                    console.log(`[CORS] 尝试代理: ${proxyUrl}`);
                    const res = await fetch(proxyUrl, { mode: 'cors' });
                    if (res.ok) {
                        const blob = await res.blob();
                        console.log(`[CORS] 代理成功 ✅`);
                        return blob;
                    }
                } catch (e) {
                    console.warn(`[CORS] 代理失败:`, e.message);
                }
                // 代理间短暂延迟，避免触发限流
                await new Promise(r => setTimeout(r, 300));
            }

            // ---- 第三步：全部失败，抛出明确错误 ----
            throw new Error(`无法获取图片（已尝试直接 fetch + ${proxyList.length} 个代理）: ${url}`);
        }

        // ============================================================
        // 7. 下载核心函数（使用 fetchImageAsBlob）
        // ============================================================
        async function downloadSelectedItems(items, zipName, concurrency = 5) {
            if (!items || items.length === 0) {
                showToast('请先选择要下载的图片', 'warn');
                return;
            }
            if (typeof JSZip === 'undefined') {
                showToast('打包库未加载，将逐个下载', 'warn');
                downloadIndividually(items);
                return;
            }

            const zip = new JSZip();
            const folder = zip.folder('gallery');
            downloadBtn.classList.add('loading');
            downloadBtn.disabled = true;

            let success = 0,
                fail = 0;
            let completed = 0;
            const total = items.length;

            async function worker(item) {
                const ext = item.src.split('.').pop().split('?')[0] || 'png';
                const filename = (item.name || 'image') + '.' + ext;
                try {
                    const blob = await fetchImageAsBlob(item.src);
                    folder.file(filename, blob);
                    success++;
                } catch (e) {
                    fail++;
                    console.warn('[下载] 跳过失败图片:', item.src, e.message);
                } finally {
                    completed++;
                    downloadBadge.textContent = completed + '/' + total;
                }
            }

            const queue = [...items];
            const workers = Array.from({ length: Math.min(concurrency, queue.length) }, () =>
                (async () => {
                    while (queue.length > 0) {
                        const item = queue.shift();
                        await worker(item);
                    }
                })()
            );

            try {
                await Promise.all(workers);
                if (success === 0) {
                    showToast('所有图片下载失败，请检查网络或稍后重试', 'error');
                    downloadBtn.classList.remove('loading');
                    downloadBtn.disabled = false;
                    updateSelectionUI();
                    downloadBadge.textContent = selectedSet.size;
                    return;
                }
                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, zipName);
                if (fail > 0) {
                    showToast(`成功打包 ${success} 张，${fail} 张失败已跳过（代理超时或图片失效）`, 'warn');
                } else {
                    showToast(`成功打包 ${success} 张图片 ✅`, 'success');
                }
            } catch (err) {
                console.error('[下载] 打包出错:', err);
                showToast('打包出错，已切换为逐个下载', 'error');
                downloadIndividually(items);
            } finally {
                downloadBtn.classList.remove('loading');
                downloadBtn.disabled = false;
                updateSelectionUI();
                downloadBadge.textContent = selectedSet.size;
            }
        }

        async function downloadIndividually(items) {
            if (!items.length) {
                showToast('没有可下载的图片', 'warn');
                return;
            }
            downloadBtn.classList.add('loading');
            downloadBtn.disabled = true;

            let success = 0,
                fail = 0;
            const total = items.length;
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const ext = item.src.split('.').pop().split('?')[0] || 'png';
                const filename = (item.name || 'image') + '.' + ext;
                downloadBadge.textContent = (i + 1) + '/' + total;
                try {
                    const blob = await fetchImageAsBlob(item.src);
                    saveAs(blob, filename);
                    success++;
                } catch (e) {
                    fail++;
                    console.warn('[逐个下载] 失败:', item.src, e.message);
                }
                // 避免过快请求
                await new Promise(r => setTimeout(r, 300));
            }

            downloadBtn.classList.remove('loading');
            downloadBtn.disabled = false;
            downloadBadge.textContent = selectedSet.size;
            if (fail > 0) {
                showToast(`成功 ${success} 张，${fail} 张失败（已跳过）`, 'warn');
            } else {
                showToast(`成功下载 ${success} 张图片 ✅`, 'success');
            }
        }

        function getSelectedItems() {
            const result = [];
            for (const key of selectedSet) {
                const found = enrichedData.find(item => getKey(item) === key);
                if (found) result.push(found);
            }
            return result;
        }

        // ============================================================
        // 8. 初始化
        // ============================================================
        totalSpan.textContent = enrichedData.length;

        const allGroups = {};
        for (const item of enrichedData) {
            const letter = item.firstLetter || '#';
            if (!allGroups[letter]) allGroups[letter] = [];
            allGroups[letter].push(item);
        }
        buildFilter(allGroups);

        currentData = enrichedData.slice();
        render(currentData);

        // ---- 搜索 ----
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                applyFilterAndSearch();
                this.blur();
            }
        });
        clearSearchBtn.addEventListener('click', function() {
            searchInput.value = '';
            updateClearBtn();
            applyFilterAndSearch();
            searchInput.focus();
        });
        searchInput.addEventListener('input', updateClearBtn);

        // ---- 全选 / 反选 ----
        selectAllCheck.addEventListener('change', function() { toggleSelectAll(this.checked); });
        document.getElementById('selectAllWrap').addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT') return;
            selectAllCheck.checked = !selectAllCheck.checked;
            toggleSelectAll(selectAllCheck.checked);
        });
        invertSelectBtn.addEventListener('click', invertSelection);

        // ---- 下载按钮 ----
        downloadBtn.addEventListener('click', function() {
            const items = getSelectedItems();
            if (items.length === 0) {
                showToast('请先选择要下载的图片', 'warn');
                return;
            }
            if (items.length <= 5) {
                downloadIndividually(items);
            } else {
                downloadSelectedItems(items, generateZipName());
            }
        });

        downloadAllBtn.addEventListener('click', function() {
            if (enrichedData.length === 0) return;
            enrichedData.forEach(item => selectedSet.add(getKey(item)));
            updateSelectionUI();
            downloadSelectedItems(enrichedData, generateZipName());
        });

        // ---- 滚动 ----
        grid.addEventListener('mouseenter', () => { isHoveringGrid = true; });
        grid.addEventListener('mouseleave', () => {
            isHoveringGrid = false;
            if (!isMouseDown) updateScrollSpyFromScroll();
        });
        grid.addEventListener('mousemove', function(e) {
            if (isMouseDown && isDraggingActive) return;
            const letter = getLetterFromMouseY(e.clientY);
            if (letter && letter !== currentLetter) {
                currentLetter = letter;
                updateScrollSpy();
            }
        });

        grid.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            isMouseDown = true;
            isDraggingActive = false;
            dragMoved = false;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragStartScrollTop = window.pageYOffset || document.documentElement.scrollTop;
            dragStartScrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            e.preventDefault();
            document.body.style.cursor = 'grabbing';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isMouseDown) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            if (!isDraggingActive && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                isDraggingActive = true;
                dragMoved = true;
            }
            if (isDraggingActive) {
                e.preventDefault();
                window.scrollTo(dragStartScrollLeft - dx, dragStartScrollTop - dy);
            }
        });

        document.addEventListener('mouseup', function(e) {
            if (!isMouseDown) return;
            isMouseDown = false;
            isDraggingActive = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            if (dragMoved) suppressClick = true;
        });

        let scrollTimer = null;
        window.addEventListener('scroll', function() {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(updateScrollSpyFromScroll, 80);
        });

        document.getElementById('scrollTopBtn').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.getElementById('scrollBottomBtn').addEventListener('click', () => {
            window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        });

        console.log('✅ 已加载 ' + enrichedData.length + ' 件礼物素材，CORS 代理已启用');
    </script>
